name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/theos/theos:latest
    steps:
      - uses: actions/checkout@v7

      - name: Build package
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -l packages

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          DEB_FILE=$(find . -path "*/packages/*.deb" | head -n 1)
          cp "$DEB_FILE" release_assets/
          
          # Extract just the .dylib from the .deb
          dpkg-deb -x "$DEB_FILE" deb_extracted
          find deb_extracted -type f -name "*.dylib" -exec cp {} release_assets/ \;
          ls -la release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          files: release_assets/*
