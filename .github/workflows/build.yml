name: Build

on:
  push:
    tags:
      - 'v*' # Triggers a release when you push a tag like v1.0.0
  workflow_dispatch:

permissions:
  contents: write # Required to create a GitHub Release

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v7

      - name: Checkout theos/theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout iOS SDK
        uses: actions/checkout@v7
        with:
          repository: Tonwalter888/iOS-18.6-SDK
          sparse-checkout: iPhoneOS18.6.sdk
          path: theos/sdks

      - name: Build package
        run: |
          set -euo pipefail
          brew install make xz ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -l packages

      - name: Upload to Actions Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: noads-deb
          path: "**/packages/*.deb"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "**/packages/*.deb"
