name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Checkout theos/theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout theos/sdks
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Build package
        # Uncomment and change the line below if your Makefile is in a subfolder:
        # working-directory: ./your-subfolder-name
        run: |
          set -euo pipefail
          brew install make xz ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -l packages

      - uses: actions/upload-artifact@v4
        with:
          name: noads-deb
          path: "**/packages/*.deb"
