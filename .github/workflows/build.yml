name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v7

      - name: Cache Theos and SDK
        id: cache-theos
        uses: actions/cache@v6
        with:
          path: theos
          key: theos-sdk-18.6-v1

      - name: Checkout theos/theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: Tonwalter888/iOS-18.6-SDK
          sparse-checkout: iPhoneOS18.6.sdk
          path: theos/sdks

            - name: Build package
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -l packages

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          DEB_FILE=$(find . -path "*/packages/*.deb" | head -n 1)
          cp "$DEB_FILE" release_assets/
          
          # Extract just the .dylib from the .deb
          mkdir -p deb_extracted
          cd deb_extracted
          ar -x "../$DEB_FILE"
          tar -xf data.tar.*
          find . -type f -name "*.dylib" -exec cp {} ../release_assets/ \;
          ls -la ../release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          files: release_assets/*
